<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<title>Pokédex con suerte · Dapica03 &amp; Rulotgar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --bg3:#334155; --line:#334155; --line2:#475569;
  --tx:#f1f5f9; --tx2:#cbd5e1; --tx3:#94a3b8; --tx4:#64748b;
  --accent:#3b82f6; --accent2:#60a5fa; --accentbg:rgba(59,130,246,.15);
  --ok:#10b981; --okbg:rgba(16,185,129,.12); --shiny:#facc15; --lucky:#f59e0b; --bad:#f43f5e;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
body.t-Rulotgar{--accent:#f43f5e; --accent2:#fb7185; --accentbg:rgba(244,63,94,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;touch-action:manipulation;padding-bottom:calc(16px + var(--safe-b))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:360px;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
.login-card img{width:72px;height:72px;border-radius:18px}
.login-card h1{font-size:22px;margin:14px 0 6px}
.login-card p{color:var(--tx3);font-size:14px;margin:0 0 20px;line-height:1.45}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:12px;background:#fff;color:#1f2937;font-weight:600;font-size:15px}
.login-err{color:var(--bad);font-size:13px;margin-top:14px}

/* HEADER */
header{position:sticky;top:0;z-index:40;background:rgba(15,23,42,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.hrow{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.me-txt{min-width:0}
.me-name{font-weight:700;font-size:14px;color:var(--accent2);white-space:nowrap}
.me-sub{font-size:11px;color:var(--tx3);white-space:nowrap}
.hspace{flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.ibtn:active{transform:scale(.95)}
.progress{height:4px;background:#020617}
.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}

/* CONTROLES */
.controls{max-width:1200px;margin:0 auto;padding:10px 10px 4px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;align-items:center}
.search{position:relative;flex:1}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx4)}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 34px 10px 36px;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--tx3);padding:6px}
select.sel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 8px;font-size:14px;color:var(--tx2);outline:none;min-width:0}
.row .sel{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.trade.on{background:#b45309;border-color:#d97706}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx3);white-space:nowrap}
.seg button.on{color:#fff}
.seg button.on[data-mode=caught]{background:var(--ok)}
.seg button.on[data-mode=shiny]{background:#a16207}
.seg button.on[data-mode=lucky]{background:#b45309}
.seg button.on[data-mode=all]{background:var(--accent)}
body.m-lucky .card.c{border-color:rgba(245,158,11,.8);background:linear-gradient(180deg,rgba(245,158,11,.14),var(--bg2) 60%)}
body.m-lucky .card.c .chk span{background:var(--lucky);border-color:var(--lucky)}
body.m-shiny .card.c{border-color:rgba(250,204,21,.75);background:linear-gradient(180deg,rgba(250,204,21,.12),var(--bg2) 60%)}
body.m-shiny .card.c .chk span{background:var(--shiny);border-color:var(--shiny)}
body.m-all .card.c{border-color:var(--accent);background:linear-gradient(180deg,var(--accentbg),var(--bg2) 60%)}
body.m-all .card.c .chk span{background:var(--accent);border-color:var(--accent);color:#fff}
.allbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:14px;border:1.5px dashed var(--line2);background:var(--bg);color:var(--tx2);font-weight:700;font-size:14px}
.allbtn.on{border-style:solid;border-color:var(--accent);color:#fff;background:var(--accentbg)}
.chip-sep{width:1px;background:var(--line);flex:none;margin:4px 2px}
.summary{max-width:1200px;margin:0 auto;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--tx3)}
.summary b{color:var(--tx)}
.summary .acts{display:flex;gap:6px}
.sbtn{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--tx2)}
.sbtn svg{width:15px;height:15px}

/* REJILLA */
main{max-width:1200px;margin:0 auto;padding:4px 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:820px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:350px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;background:var(--bg2);border:1.5px solid var(--line);border-radius:var(--r);padding:6px 6px 8px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 170px;user-select:none;-webkit-user-select:none}
.card:active{transform:scale(.98)}
.card.c{border-color:rgba(16,185,129,.7);background:linear-gradient(180deg,rgba(16,185,129,.10),var(--bg2) 60%)}
.ctop{display:flex;justify-content:space-between;align-items:center}
.num{font-size:10px;font-family:ui-monospace,monospace;color:var(--tx3);font-weight:700}
.chk{width:30px;height:30px;margin:-4px -4px 0 0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.chk span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
.card.c .chk span{background:var(--ok);border-color:var(--ok);color:#022c22}
.chk svg{width:14px;height:14px;stroke-width:3}
.card .art{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.card img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.card:not(.c) img{opacity:.55;filter:grayscale(.35)}
.cname{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ctypes{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.tp{font-size:9.5px;padding:2px 6px;border-radius:6px;color:#fff;font-weight:600;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.badges{position:absolute;top:30px;right:6px;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1}
.fbadge{position:absolute;left:6px;top:24px;font-size:9px;color:var(--tx3);background:rgba(2,6,23,.6);padding:1px 5px;border-radius:6px}
.fbadge.full{color:#6ee7b7}
.empty{text-align:center;color:var(--tx3);padding:60px 10px}
.loading{text-align:center;color:var(--tx3);padding:80px 10px}
.spin{width:30px;height:30px;border:4px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* MODALES / HOJAS */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.75);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.overlay{align-items:center;padding:20px}}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:up .2s ease-out}
@media(min-width:700px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sh-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-size:16px;flex:1}
.sh-body{overflow-y:auto;padding:14px;padding-bottom:calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700;margin:0 0 8px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:12px;background:var(--bg3);color:var(--tx);font-weight:600;font-size:14px;width:100%}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{background:rgba(244,63,94,.12);color:#fda4af;border:1px solid rgba(244,63,94,.35)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--tx3);font-size:13px;line-height:1.45;margin:0}

/* FICHA */
.dt-hero{position:relative;text-align:center;background:radial-gradient(circle at 50% 45%,var(--accentbg),transparent 65%);border-radius:16px;padding:6px}
.dt-hero img{width:min(62vw,240px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.dt-sw{position:absolute;top:6px;right:6px;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--tx2)}
.dt-sw.on{border-color:var(--shiny);color:var(--shiny)}
.dt-name{text-align:center}
.dt-name .n{font-size:24px;font-weight:800}
.dt-name .m{font-size:12px;color:var(--tx3);margin-top:2px}
.dt-types{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dt-types .tp{font-size:12px;padding:4px 10px;border-radius:8px}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--tx3)}
.mk .e{font-size:22px;filter:grayscale(1);opacity:.5}
.mk.on .e{filter:none;opacity:1}
.mk.on.c{border-color:var(--ok);color:#6ee7b7;background:var(--okbg)}
.mk.on.s{border-color:var(--shiny);color:#fde047;background:rgba(250,204,21,.1)}
.mk.on.l{border-color:var(--lucky);color:#fcd34d;background:rgba(245,158,11,.1)}
.other{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
.other .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.stats div{background:var(--bg2);border-radius:10px;padding:8px 2px}
.stats b{display:block;font-size:16px}
.stats span{font-size:10px;color:var(--tx3)}
.evo{display:flex;align-items:center;gap:4px;overflow-x:auto;padding-bottom:4px}
.evo-col{display:flex;flex-direction:column;gap:6px}
.evo-arrow{color:var(--tx4);flex:none}
.evo-it{display:flex;flex-direction:column;align-items:center;width:78px;padding:6px 2px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);font-size:11px;text-align:center}
.evo-it img{width:52px;height:52px;object-fit:contain}
.evo-it.cur{border-color:var(--accent)}
.evo-it.c{box-shadow:inset 0 0 0 1px rgba(16,185,129,.5)}
.evo-it .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}
.forms{display:flex;flex-direction:column;gap:8px}
.form{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line)}
.form.c{border-color:rgba(16,185,129,.6)}
.form img{width:56px;height:56px;object-fit:contain;flex:none}
.form .fi{flex:1;min-width:0}
.form .fl{font-weight:700;font-size:13px}
.form .fc{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.form .ctypes{margin-top:3px}
.fmk{display:flex;gap:4px}
.fmk button{width:36px;height:36px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-size:16px;filter:grayscale(1);opacity:.55}
.fmk button.on{filter:none;opacity:1}
.fmk button.on.c{border-color:var(--ok);background:var(--okbg)}
.fmk button.on.s{border-color:var(--shiny)}
.fmk button.on.l{border-color:var(--lucky)}
.fmk button.on.a{border-color:var(--accent)}
.fmk button{width:32px;height:34px}
.fmk .ck{color:var(--ok);font-weight:900;font-size:15px}
.navbtns{display:flex;gap:8px}

/* COMPARADOR */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs .p{border-radius:12px;padding:10px;text-align:center}
.vs .p.D{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35)}
.vs .p.R{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35)}
.vs .big{font-size:24px;font-weight:900}
.vs .sm{font-size:11px;color:var(--tx3)}
.reg{display:flex;flex-direction:column;gap:6px}
.reg-row{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.reg-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.reg-top span{font-weight:400;color:var(--tx3);font-size:11px}
.bar{height:6px;border-radius:4px;background:var(--bg3);overflow:hidden;margin-top:3px}
.bar div{height:100%}
.reg-l{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-top:5px}

/* TOAST / BANNER */
#toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#0b1220;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:13px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#offline{background:#78350f;color:#fde68a;font-size:12px;text-align:center;padding:5px 8px}

/* ===== Pokédex con suerte ===== */
:root{--ok:#f59e0b;--okbg:rgba(245,158,11,.14)}
.card.c{border-color:rgba(245,158,11,.8);background:linear-gradient(180deg,rgba(245,158,11,.14),var(--bg2) 60%)}
.card.c .chk span{background:transparent;border-color:var(--lucky);font-size:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo-p{border-radius:12px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.duo-p b{font-size:13px}
.duo-p.D{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35)} .duo-p.D b{color:#93c5fd}
.duo-p.R{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35)} .duo-p.R b{color:#fda4af}
.duo-p .bar{margin-top:4px} #barD{background:#3b82f6} #barR{background:#f43f5e}
.seg{display:grid;grid-template-columns:1.1fr 1.3fr 1fr .8fr;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:8px 2px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{color:#fff;background:#b45309}
.pls{display:flex;gap:4px;margin-top:5px}
.pl{flex:1;font-size:10.5px;font-weight:700;padding:4px 0;border-radius:8px;text-align:center;background:var(--bg);border:1px solid var(--line);color:var(--tx4)}
.pl.D.on{border-color:#3b82f6;color:#bfdbfe;background:rgba(59,130,246,.18)}
.pl.R.on{border-color:#f43f5e;color:#fecdd3;background:rgba(244,63,94,.18)}
.pl.mine{cursor:pointer}
.form .pls{width:96px;margin:0;flex:none}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-p{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);color:var(--tx3);font-size:12px;text-align:center}
.who-p .e{font-size:26px;filter:grayscale(1);opacity:.4}
.who-p.on .e{filter:none;opacity:1}
.who-p b{font-size:14px;color:var(--tx)}
.who-p small{font-size:10.5px;color:var(--tx4)}
.who-p.D.on{border-color:#3b82f6;background:rgba(59,130,246,.12);color:#bfdbfe}
.who-p.R.on{border-color:#f43f5e;background:rgba(244,63,94,.12);color:#fecdd3}
button.who-p{cursor:pointer}
.fbadge{top:24px}
</style>
</head>
<body>

<!-- ICONOS -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
'use strict';
const APP_VERSION = '3.1.0';
const DATA_VERSION = '2026-11-12';

/* ================= CONFIGURACIÓN ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCNijgzjLT2hBlvZ2XgnM71QdWnagSva_k",
  authDomain: "pokedex-dapica-rulotgar.firebaseapp.com",
  projectId: "pokedex-dapica-rulotgar",
  storageBucket: "pokedex-dapica-rulotgar.firebasestorage.app",
  messagingSenderId: "968669174895",
  appId: "1:968669174895:web:447f44a6db7c7d507e419a"
};
const ACCOUNTS = { 'f.dapica@gmail.com': 'Dapica03', 'lotyal95@gmail.com': 'Rulotgar' };
const TRAINERS = ['Dapica03', 'Rulotgar'];
const OTHER = { Dapica03: 'Rulotgar', Rulotgar: 'Dapica03' };

/* Pokémon que no aparecen en la Pokédex con suerte de Pokémon GO (no se pueden intercambiar).
   Meltan y Melmetal sí pueden salir con suerte, por eso no están aquí. */
const MYTHICAL = new Set([151, 251, 385, 386, 489, 490, 491, 492, 493, 494, 647, 648, 649, 718, 719, 720, 721, 801, 802, 807, 893, 1025]);

const REGIONS = [
  ['kanto','Kanto',1,151],['johto','Johto',152,251],['hoenn','Hoenn',252,386],['sinnoh','Sinnoh',387,493],
  ['unova','Teselia',494,649],['kalos','Kalos',650,721],['alola','Alola',722,809],['galar','Galar',810,898],
  ['hisui','Hisui',899,905],['paldea','Paldea',906,1025]
];
const TYPES = [
  ['Normal','#9099a1'],['Lucha','#ce4069'],['Volador','#8fa8dd'],['Veneno','#ab6ac8'],['Tierra','#d97746'],['Roca','#c5b78c'],
  ['Bicho','#90c12c'],['Fantasma','#5269ac'],['Acero','#5a8ea1'],['Fuego','#ff9c54'],['Agua','#4d90d5'],['Planta','#63bb5b'],
  ['Eléctrico','#e5c531'],['Psíquico','#f97176'],['Hielo','#74cec0'],['Dragón','#0a6dc4'],['Siniestro','#5a5366'],['Hada','#ec8fe6']
];
const FORM_CAT = { r: 'Regional', o: 'Forma', g: 'Gigamax' };
const FORM_ORDER = { r: 0, o: 1, g: 2 };
const FORM_LABELS = {
  alola:'Forma de Alola', galar:'Forma de Galar', 'galar-standard':'Forma de Galar', hisui:'Forma de Hisui', paldea:'Forma de Paldea',
  'paldea-combat-breed':'Paldea · Raza Combatiente', 'paldea-blaze-breed':'Paldea · Raza Ardiente', 'paldea-aqua-breed':'Paldea · Raza Acuática',
  origin:'Forma Origen', 'white-striped':'Forma Raya Blanca', 'blue-striped':'Forma Raya Azul', female:'Hembra', therian:'Forma Tótem',
  'blue-plumage':'Plumaje Azul', 'yellow-plumage':'Plumaje Amarillo', 'white-plumage':'Plumaje Blanco',
  droopy:'Forma Lánguida', stretchy:'Forma Estirada', roaming:'Forma Andante'
};
const ART = (pid) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pid}.png`;

/* ================= UTILIDADES ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pad = n => '#' + String(n).padStart(4, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem('pdxl_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pdxl_' + k, JSON.stringify(v)); } catch {} }
};
let toastT;
function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), ms);
}
const typeTag = i => `<span class="tp" style="background:${TYPES[i][1]}">${TYPES[i][0]}</span>`;
const icon = (id, cls = 'i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;

/* ================= DATOS POKÉMON ================= */
let SPECIES = [], BY_ID = new Map(), BY_KEY = new Map(), FORMS = [];
const regionOf = id => (REGIONS.find(r => id >= r[2] && id <= r[3]) || REGIONS[9])[0];

async function loadData() {
  const r = await fetch('pokedex-data.json?v=' + DATA_VERSION);
  if (!r.ok) throw new Error('No se pudieron cargar los datos');
  const d = await r.json();
  const tps = t => [...t].map(c => parseInt(c, 36));
  SPECIES = d.P.filter(p => !MYTHICAL.has(p[0])).map(([id, name, t, gen, chain, from]) => ({
    id, key: String(id), name, n: norm(name), types: tps(t), gen, chain, from, region: regionOf(id), forms: []
  }));
  SPECIES.forEach(s => { BY_ID.set(s.id, s); BY_KEY.set(s.key, s); });
  d.F.forEach(([sid, pid, cat, suf, n, t]) => {
    const s = BY_ID.get(sid); if (!s || cat === 'm') return;   // las megas no cuentan: no son Pokémon aparte
    const label = cat === 'g' ? 'Gigamax' : (FORM_LABELS[suf] || n || suf.replace(/-/g, ' '));
    const f = { key: 'f' + pid, pid, sid, cat, label, types: tps(t), sp: s };
    s.forms.push(f); FORMS.push(f); BY_KEY.set(f.key, f);
  });
  SPECIES.forEach(s => s.forms.sort((a, b) => FORM_ORDER[a.cat] - FORM_ORDER[b.cat] || a.pid - b.pid));
}

/* ================= ESTADO ================= */
const state = {
  me: null, other: null,
  lucky: { Dapica03: {}, Rulotgar: {} },
  region: store.get('region', 'all'), type: store.get('type', 'all'), sort: store.get('sort', 'num'),
  view: store.get('view', 'me'), q: '', list: [], detail: null
};
const L = (t, key) => !!state.lucky[t][key];

/* ================= FIREBASE ================= */
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
const FV = firebase.firestore.FieldValue;
const docRef = t => db.collection('pokedex').doc(t);
let unsubs = [];

function writeLucky(changes) { // { key: bool }
  const me = state.me, lucky = {};
  for (const [k, v] of Object.entries(changes)) {
    if (v) state.lucky[me][k] = true; else delete state.lucky[me][k];
    lucky[k] = v ? true : FV.delete();
  }
  docRef(me).set({ lucky, updatedAt: FV.serverTimestamp() }, { merge: true })
    .catch(e => { console.error(e); toast('⚠️ No se pudo guardar: ' + (e.code || e.message)); });
  scheduleRender();
}
const toggle = key => writeLucky({ [key]: !L(state.me, key) });

const OLD_FORMS = { r1: 'f10091', r2: 'f10100', r3: 'f10161', r4: 'f10238', r5: 'f10253' };
/* Acepta: copia de esta app ({lucky}), copia v2 ({caught}) o la copia antigua ({"1":true,"r1":true...}) */
function keysFromBackup(data) {
  const nonEmpty = o => o && typeof o === 'object' && Object.keys(o).length ? o : null;
  const src = (data && (nonEmpty(data.lucky) || (data.version === 2 ? data.caught : null) || (data.version ? null : data))) || {};
  const ch = {};
  for (const [k, v] of Object.entries(src)) { const key = OLD_FORMS[k] || k; if (v && BY_KEY.has(key)) ch[key] = true; }
  return ch;
}

/* Primera vez: carga automáticamente la lista guardada del entrenador (solo si aún no tiene ningún 🍀) */
async function migrateIfNeeded(t) {
  try {
    const r = await fetch('migracion-' + t + '.json', { cache: 'no-store' });
    if (!r.ok) return;
    const ch = keysFromBackup(await r.json());
    const n = Object.keys(ch).length; if (!n) return;
    writeLucky(ch);
    docRef(t).set({ luckyMigrated: true }, { merge: true }).catch(() => {});
    toast(`✅ Importados ${n} Pokémon con suerte de tu copia`, 4000);
  } catch {}
}

function subscribe() {
  unsubs.forEach(u => u()); unsubs = [];
  TRAINERS.forEach(t => {
    let checked = false;
    unsubs.push(docRef(t).onSnapshot({ includeMetadataChanges: true }, snap => {
      const d = snap.data(), x = {};
      if (!checked && t === state.me && !snap.metadata.fromCache && SPECIES.length) {
        checked = true;
        if (!(d && d.luckyMigrated) && !(d && d.lucky && Object.keys(d.lucky).length)) migrateIfNeeded(t);
      }
      if (d && d.lucky) for (const [k, v] of Object.entries(d.lucky)) if (v) x[k] = true;
      state.lucky[t] = x;
      scheduleRender();
    }, err => { console.error(err); toast('⚠️ Error de sincronización: ' + (err.code || err.message), 4000); }));
  });
}

/* ---------- Inicio de sesión ---------- */
$('#btnLogin').onclick = async () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  $('#loginErr').classList.add('hidden');
  try { await auth.signInWithPopup(provider); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) return auth.signInWithRedirect(provider);
    if (e.code !== 'auth/popup-closed-by-user') showLoginErr(e);
  }
};
auth.getRedirectResult().catch(showLoginErr);
function showLoginErr(e) {
  const el = $('#loginErr'); el.textContent = 'No se pudo iniciar sesión: ' + (e.code || e.message); el.classList.remove('hidden');
}

auth.onAuthStateChanged(async user => {
  if (!user) {
    unsubs.forEach(u => u()); unsubs = [];
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
    return;
  }
  const trainer = ACCOUNTS[(user.email || '').toLowerCase()];
  if (!trainer) { showLoginErr({ message: `la cuenta ${user.email} no tiene acceso.` }); await auth.signOut(); return; }
  state.me = trainer; state.other = OTHER[trainer];
  document.body.className = 't-' + trainer;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#avatar').textContent = trainer[0];
  $('#meName').textContent = trainer;
  document.querySelector('[data-view="other"]').textContent = `Le faltan a ${state.other}`;
  dataReady.then(subscribe); scheduleRender();
});

/* ================= FILTROS Y LISTA ================= */
function buildControls() {
  const reg = $('#fRegion');
  reg.innerHTML = `<option value="all">🌐 Todas las regiones</option>` +
    REGIONS.map(r => `<option value="${r[0]}">${r[1]}</option>`).join('') +
    `<option value="forms">Con formas</option>`;
  reg.value = state.region;
  $('#fType').innerHTML = `<option value="all">Todos los tipos</option>` + TYPES.map((t, i) => `<option value="${i}">${t[0]}</option>`).join('');
  $('#fType').value = state.type; $('#fSort').value = state.sort;
  reg.onchange = e => { state.region = e.target.value; store.set('region', state.region); render(); scrollTo({ top: 0, behavior: 'smooth' }); };
  $('#fType').onchange = e => { state.type = e.target.value; store.set('type', state.type); render(); };
  $('#fSort').onchange = e => { state.sort = e.target.value; store.set('sort', state.sort); render(); };
  let qt;
  $('#q').oninput = e => {
    $('#qClear').classList.toggle('hidden', !e.target.value);
    clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; render(); }, 140);
  };
  $('#qClear').onclick = () => { $('#q').value = ''; state.q = ''; $('#qClear').classList.add('hidden'); render(); };
  $('#viewSeg').onclick = e => {
    const b = e.target.closest('[data-view]'); if (!b) return;
    state.view = b.dataset.view; store.set('view', state.view); render(); scrollTo({ top: 0 });
  };
}

const inRegion = s => state.region === 'all' ? true : state.region === 'forms' ? s.forms.length > 0 : s.region === state.region;
// Para una especie con formas: falta si falta la especie O alguna de sus formas
const missing = (t, s) => !L(t, s.key) || s.forms.some(f => !L(t, f.key));
const missingBase = (t, s) => !L(t, s.key);

function filtered() {
  const me = state.me, ot = state.other;
  const q = norm(state.q.trim()).replace(/^#/, '');
  const qNum = /^\d+$/.test(q) ? String(parseInt(q, 10)) : null;
  const qExact = qNum && (/^\s*#/.test(state.q) || /^0/.test(q));
  const type = state.type === 'all' ? null : +state.type;
  const miss = state.region === 'forms' ? missing : missingBase;
  const out = SPECIES.filter(s => {
    if (!inRegion(s)) return false;
    if (q) {
      if (qNum) { if (qExact ? s.key !== qNum : !s.key.startsWith(qNum)) return false; }
      else if (!s.n.includes(q)) return false;
    }
    if (type !== null && !s.types.includes(type)) return false;
    if (state.view === 'me' && !miss(me, s)) return false;
    if (state.view === 'other' && !miss(ot, s)) return false;
    if (state.view === 'both' && !(miss(me, s) && miss(ot, s))) return false;
    return true;
  });
  const coll = new Intl.Collator('es');
  if (state.sort === 'numd') out.reverse();
  else if (state.sort === 'az') out.sort((a, b) => coll.compare(a.name, b.name));
  else if (state.sort === 'za') out.sort((a, b) => coll.compare(b.name, a.name));
  return out;
}

function pill(t, key) {
  const on = L(t, key), mine = t === state.me;
  return `<${mine ? 'button' : 'span'} class="pl ${t[0]} ${on ? 'on' : ''} ${mine ? 'mine' : ''}" ${mine ? 'data-tg="' + key + '"' : ''}>${t[0]} ${on ? '🍀' : '—'}</${mine ? 'button' : 'span'}>`;
}

function cardHTML(s) {
  const me = state.me, c = L(me, s.key);
  let fb = '';
  if (s.forms.length) {
    const fc = s.forms.filter(f => L(me, f.key)).length;
    fb = `<span class="fbadge ${fc === s.forms.length ? 'full' : ''}">+${s.forms.length} formas · ${fc}🍀</span>`;
  }
  return `<div class="card ${c ? 'c' : ''}" data-k="${s.key}">
    <div class="ctop"><span class="num">${pad(s.id)}</span><button class="chk" aria-label="Marcar con suerte"><span>${c ? '🍀' : ''}</span></button></div>
    ${fb}
    <div class="art"><img loading="lazy" decoding="async" alt="" src="${ART(s.id)}"></div>
    <div class="cname">${esc(s.name)}</div>
    <div class="pls">${pill('Dapica03', s.key)}${pill('Rulotgar', s.key)}</div>
  </div>`;
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function render() {
  if (!state.me || !SPECIES.length) return;
  $('#loading').classList.add('hidden');
  const list = state.list = filtered();
  $('#grid').innerHTML = list.map(cardHTML).join('');
  $('#empty').classList.toggle('hidden', list.length > 0);
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  $('#sumCount').textContent = list.length;
  $('#sumLabel').textContent = { me: 'me faltan con suerte', other: `le faltan a ${state.other}`, both: 'nos faltan a los dos', all: 'Pokémon' }[state.view];
  const allC = list.length && list.every(s => L(state.me, s.key));
  $('#markAllTxt').textContent = allC ? 'Desmarcar visibles' : 'Marcar visibles';
  updateHeader();
  if (state.detail) renderDetail();
  if (currentDlg === 'compare') renderCompare();
}

function updateHeader() {
  const pool = SPECIES.filter(s => state.region === 'all' || state.region === 'forms' || s.region === state.region);
  const n = t => pool.filter(s => L(t, s.key)).length;
  const regName = state.region === 'all' || state.region === 'forms' ? 'Total' : REGIONS.find(r => r[0] === state.region)[1];
  const pct = c => pool.length ? Math.round(c / pool.length * 100) : 0;
  const d = n('Dapica03'), r = n('Rulotgar'), m = n(state.me);
  $('#meSub').textContent = `🍀 ${regName}: ${m}/${pool.length} (${pct(m)}%) · faltan ${pool.length - m}`;
  $('#progBar').style.width = pct(m) + '%';
  $('#duoD').textContent = `🍀 ${d}/${pool.length} · faltan ${pool.length - d}`;
  $('#duoR').textContent = `🍀 ${r}/${pool.length} · faltan ${pool.length - r}`;
  $('#barD').style.width = pct(d) + '%'; $('#barR').style.width = pct(r) + '%';
}

/* ---------- Clic en la rejilla ---------- */
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const k = card.dataset.k;
  const tg = e.target.closest('[data-tg]');
  if (tg || e.target.closest('.chk')) { toggle(tg ? tg.dataset.tg : k); if (navigator.vibrate) navigator.vibrate(12); return; }
  if (e.target.closest('.pl')) return;
  openDetail(k);
});

$('#btnMarkAll').onclick = () => {
  const list = state.list; if (!list.length) return;
  const allC = list.every(s => L(state.me, s.key));
  if (list.length > 15 && !confirm(`¿${allC ? 'Desmarcar' : 'Marcar con suerte'} ${list.length} Pokémon?`)) return;
  const ch = {}; list.forEach(s => ch[s.key] = !allC); writeLucky(ch);
};

/* ---------- Compartir lista ---------- */
$('#btnShare').onclick = async () => {
  const list = state.list; if (!list.length) return toast('No hay nada que compartir');
  const title = { me: `🍀 Me faltan con suerte (${state.me})`, other: `🍀 Le faltan con suerte a ${state.other}`, both: '🍀 Nos faltan con suerte a los dos', all: '🍀 Pokédex con suerte' }[state.view];
  const parts = [title];
  if (state.region !== 'all') parts.push($('#fRegion').selectedOptions[0].textContent);
  if (state.type !== 'all') parts.push('tipo ' + TYPES[state.type][0]);
  const lines = list.map(s => `${pad(s.id)} ${s.name}`);
  const text = `${parts.join(' · ')} (${list.length})\n\n${lines.join('\n')}`;
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Lista copiada'); } catch {}
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
};

/* ================= DIÁLOGOS ================= */
let currentDlg = null;
function openDlg(name, html) {
  currentDlg = name;
  const d = $('#dlg'); d.innerHTML = html; d.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  if (history.state?.dlg !== name) history.pushState({ dlg: name }, '');
}
function closeDlg(fromPop) {
  if (!currentDlg) return;
  currentDlg = null; state.detail = null;
  $('#dlg').classList.add('hidden'); $('#dlg').innerHTML = '';
  document.body.style.overflow = '';
  if (!fromPop && history.state?.dlg) history.back();
}
window.addEventListener('popstate', () => closeDlg(true));
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg' || e.target.closest('[data-close]')) closeDlg(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDlg();
  if (state.detail && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) stepDetail(e.key === 'ArrowRight' ? 1 : -1);
});

/* ---------- Ficha ---------- */
function openDetail(key) { state.detail = key; openDlg('detail', '<div class="sheet" id="sheet"></div>'); renderDetail(); }
function stepDetail(dir) {
  const Ls = state.list.length ? state.list : SPECIES;
  let i = Ls.findIndex(s => s.key === state.detail);
  i = i < 0 ? 0 : (i + dir + Ls.length) % Ls.length;
  state.detail = Ls[i].key; renderDetail(); $('#sheet .sh-body')?.scrollTo(0, 0);
}

function whoRow(key) {
  return `<div class="who">${TRAINERS.map(t => {
    const on = L(t, key), mine = t === state.me;
    return `<${mine ? 'button' : 'div'} class="who-p ${t[0]} ${on ? 'on' : ''}" ${mine ? 'data-tg="' + key + '"' : ''}>
      <span class="e">🍀</span><b>${t}</b><span>${on ? 'Lo tiene con suerte' : 'Le falta'}${mine ? '' : ''}</span>${mine ? `<small>${on ? 'Toca para quitar' : 'Toca para marcar'}</small>` : ''}</${mine ? 'button' : 'div'}>`;
  }).join('')}</div>`;
}

function familyHTML(s) {
  const fam = SPECIES.filter(x => x.chain === s.chain);
  if (fam.length < 2) return '';
  const ids = new Set(fam.map(x => x.id));
  const depth = x => (x.from && ids.has(x.from)) ? depth(BY_ID.get(x.from)) + 1 : 0;
  const cols = [];
  fam.forEach(x => { const d = depth(x); (cols[d] = cols[d] || []).push(x); });
  return `<div><p class="sec-t">Familia evolutiva</p><div class="evo">` + cols.map((col, i) =>
    (i ? `<span class="evo-arrow">${icon('right')}</span>` : '') +
    `<div class="evo-col">${col.map(x => `<button class="evo-it ${x.id === s.id ? 'cur' : ''} ${L(state.me, x.key) ? 'c' : ''}" data-go="${x.key}">
      <img loading="lazy" src="${ART(x.id)}" alt=""><span class="x">${esc(x.name)}</span><span style="color:var(--tx4)">${L(state.me, x.key) ? '🍀' : pad(x.id)}</span></button>`).join('')}</div>`
  ).join('') + `</div></div>`;
}

function formsHTML(s) {
  if (!s.forms.length) return '';
  return `<div><p class="sec-t">Formas con suerte</p><div class="forms">` + s.forms.map(f => `
    <div class="form ${L(state.me, f.key) ? 'c' : ''}">
      <img loading="lazy" src="${ART(f.pid)}" alt="" onerror="this.src='${ART(s.id)}'">
      <div class="fi"><div class="fc">${FORM_CAT[f.cat]}</div><div class="fl">${esc(f.label)}</div></div>
      <div class="pls">${pill('Dapica03', f.key)}${pill('Rulotgar', f.key)}</div>
    </div>`).join('') + `</div></div>`;
}

function renderDetail() {
  const s = BY_KEY.get(state.detail); const el = $('#sheet'); if (!s || !el) return;
  const prev = el.querySelector('.sh-body')?.scrollTop || 0;
  const reg = REGIONS.find(r => r[0] === s.region)[1];
  el.innerHTML = `
    <div class="sh-head">
      <button class="ibtn" data-step="-1" aria-label="Anterior">${icon('left')}</button>
      <h3 style="text-align:center">${pad(s.id)}</h3>
      <button class="ibtn" data-step="1" aria-label="Siguiente">${icon('right')}</button>
      <button class="ibtn" data-close aria-label="Cerrar">${icon('x')}</button>
    </div>
    <div class="sh-body">
      <div class="dt-hero"><img src="${ART(s.id)}" alt="${esc(s.name)}"></div>
      <div class="dt-name"><div class="n">${esc(s.name)}</div><div class="m">${reg} · Generación ${s.gen}</div>
        <div class="dt-types">${s.types.map(typeTag).join('')}</div></div>
      ${whoRow(s.key)}
      ${formsHTML(s)}
      ${familyHTML(s)}
    </div>`;
  el.querySelector('.sh-body').scrollTop = prev;
}

$('#dlg').addEventListener('click', e => {
  const tg = e.target.closest('[data-tg]'); if (tg) { toggle(tg.dataset.tg); if (navigator.vibrate) navigator.vibrate(12); return; }
  const st = e.target.closest('[data-step]'); if (st) return stepDetail(+st.dataset.step);
  const go = e.target.closest('[data-go]'); if (go) { state.detail = go.dataset.go; renderDetail(); $('#sheet .sh-body').scrollTo(0, 0); }
});
let tx0 = null, ty0 = null;
$('#dlg').addEventListener('touchstart', e => { if (state.detail) { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; } }, { passive: true });
$('#dlg').addEventListener('touchend', e => {
  if (tx0 === null || !state.detail) return;
  const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0; tx0 = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && !e.target.closest('.evo')) stepDetail(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- Por regiones ---------- */
$('#btnCompare').onclick = () => { openDlg('compare', '<div class="sheet" id="cmp"></div>'); renderCompare(); };
function renderCompare() {
  const el = $('#cmp'); if (!el) return;
  const cnt = (t, pool) => pool.filter(x => L(t, x.key)).length;
  const D = 'Dapica03', R = 'Rulotgar';
  const both = SPECIES.filter(s => !L(D, s.key) && !L(R, s.key)).length;
  const rows = REGIONS.map(([k, name]) => {
    const pool = SPECIES.filter(s => s.region === k), n = pool.length;
    const cd = cnt(D, pool), cr = cnt(R, pool);
    return `<div class="reg-row"><div class="reg-top">${name}<span>${n} posibles</span></div>
      <div class="bar"><div style="width:${cd / n * 100}%;background:#3b82f6"></div></div>
      <div class="bar"><div style="width:${cr / n * 100}%;background:#f43f5e"></div></div>
      <div class="reg-l"><span style="color:#93c5fd">Dapica03 ${cd} · faltan ${n - cd}</span><span style="color:#fda4af">Rulotgar ${cr} · faltan ${n - cr}</span></div></div>`;
  }).join('');
  el.innerHTML = `<div class="sh-head"><h3>🍀 Progreso con suerte</h3><button class="ibtn" data-close>${icon('x')}</button></div>
    <div class="sh-body">
      <div class="box"><p class="muted">Faltan a los dos: <b style="color:var(--tx)">${both}</b>. Intercambiarlos entre vosotros os da a ambos la oportunidad de que salgan con suerte.</p></div>
      <div class="reg">${rows}</div>
      <p class="muted" style="font-size:11px">Igual que en el juego, no se incluyen los Pokémon que no se pueden intercambiar (Mew, Celebi, Zygarde…). Meltan y Melmetal sí cuentan.</p>
    </div>`;
}

/* ---------- Ajustes ---------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
$('#btnSettings').onclick = () => {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const installHTML = isStandalone() ? `<p class="muted">✅ La app ya está instalada en este dispositivo.</p>`
    : deferredInstall ? `<button class="btn pri" id="btnInstall">${icon('phone')} Instalar como app</button>`
    : ios ? `<p class="muted">En iPhone: abre esta página en <b>Safari</b>, pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.</p>`
    : `<p class="muted">En Android: menú ⋮ de Chrome → <b>Instalar aplicación</b>.</p>`;
  openDlg('settings', `<div class="sheet">
    <div class="sh-head"><h3>Ajustes</h3><button class="ibtn" data-close>${icon('x')}</button></div>
    <div class="sh-body">
      <div class="box"><p class="sec-t">Cuenta</p>
        <p class="muted">Has entrado como <b style="color:var(--accent2)">${state.me}</b><br>${esc(auth.currentUser?.email || '')}</p>
        <div style="height:10px"></div><button class="btn" id="btnLogout">${icon('out')} Cerrar sesión</button></div>
      <div class="box"><p class="sec-t">Instalar en el móvil</p>${installHTML}
        <p class="muted" style="margin-top:8px">Funciona sin conexión: lo que marques se sube solo al volver la conexión.</p></div>
      <div class="box"><p class="sec-t">Copia de seguridad</p>
        <div class="btn2"><button class="btn" id="btnExport">${icon('down')} Exportar</button>
        <label class="btn" style="cursor:pointer">${icon('up')} Importar<input type="file" id="fileImport" accept=".json,application/json" hidden></label></div></div>
      <div class="box"><button class="btn danger" id="btnReset">${icon('trash')} Borrar todos mis 🍀</button></div>
      <p class="muted" style="text-align:center;font-size:11px">Versión ${APP_VERSION} · Datos de PokeAPI</p>
    </div></div>`);
  $('#btnLogout').onclick = () => { if (confirm('¿Cerrar sesión?')) { closeDlg(); auth.signOut(); } };
  $('#btnInstall') && ($('#btnInstall').onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; closeDlg(); });
  $('#btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify({ version: 3, trainer: state.me, exportedAt: new Date().toISOString(), lucky: state.lucky[state.me] })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `pokedex_suerte_${state.me}_${new Date().toISOString().slice(0, 10)}.json`; a.click();
  };
  $('#fileImport').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const ch = keysFromBackup(JSON.parse(r.result));
        if (!Object.keys(ch).length) return toast('El archivo no tiene Pokémon con suerte');
        if (!confirm(`Se añadirán ${Object.keys(ch).length} Pokémon con suerte. ¿Continuar?`)) return;
        writeLucky(ch); closeDlg(); toast('✅ Importado');
      } catch { toast('⚠️ El archivo no es válido'); }
    };
    r.readAsText(file);
  };
  $('#btnReset').onclick = () => {
    if (!confirm(`¿Borrar TODOS los Pokémon con suerte de ${state.me}? No se puede deshacer.`)) return;
    state.lucky[state.me] = {};
    docRef(state.me).set({ lucky: FV.delete(), updatedAt: FV.serverTimestamp() }, { merge: true }).catch(e => toast('⚠️ ' + (e.code || e.message)));
    closeDlg(); render(); toast('Borrado');
  };
};

/* ================= CONEXIÓN Y SERVICE WORKER ================= */
const setOnline = () => $('#offline').classList.toggle('hidden', navigator.onLine);
addEventListener('online', setOnline); addEventListener('offline', setOnline); setOnline();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return; reloaded = true;
    if (!currentDlg) location.reload();
  });
}

/* ================= ARRANQUE ================= */
buildControls();
const dataReady = loadData();
dataReady.then(() => scheduleRender()).catch(err => {
  console.error(err);
  $('#loading').innerHTML = '⚠️ No se pudieron cargar los datos. Comprueba tu conexión y recarga.';
});
</script>
</body>
</html>
